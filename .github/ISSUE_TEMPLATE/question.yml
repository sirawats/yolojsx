name: Usage question
description: Ask for help using rtifact
title: "[Question] "
body:
  - type: input
    id: version
    attributes:
      label: rtifact version
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and operating system
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
      description: Include safe commands and error output without private data.
    validations:
      required: true
